# vite.config.js 의 dev 프록시를 그대로 옮긴 것이다.
# 브라우저는 전부 이 서버(같은 origin)로 보내고 nginx 가 중계하므로
# JSESSIONID / XSRF-TOKEN 쿠키가 그대로 오가고 CORS 도 필요 없다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 분석용 클립 업로드
    client_max_body_size 1g;

    # 백엔드. Vite 의 changeOrigin:false 와 맞추려고 원래 Host 를 넘긴다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hls/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # AI 서버. /ai 접두어를 떼고 넘긴다.  /ai/health -> ai:8000/health
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
